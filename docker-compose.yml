version: "3.8"

services:
  # All-in-One RAG Service: API + Redis + Worker
  # Single container with:
  # - FastAPI on port 8000
  # - Redis on port 6379 (with 256MB memory limit)
  # - Background Worker for document processing
  rag:
    build: .
    container_name: rag_api_complete
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      DIMENSION_OF_MODEL: ${DIMENSION_OF_MODEL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
    ports:
      - "8000:8000"
      - "6379:6379"
    volumes:
      # Shared storage for temp files
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

